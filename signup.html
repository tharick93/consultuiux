<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Stackly Legal Consulting</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/signup.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="auth-body">

<div class="signup-page">
  <div class="signup-left">
    <div class="brand-blob">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none"><path d="M15.5 2c-4 0-7.5 2.5-7.5 6 0 2.7 2 4 4.5 4.7-3.2.7-6 2.7-6 5.8 0 3.3 3.3 5.5 7.5 5.5 3.8 0 6.5-1.8 6.5-1.8l-1.2-2.6s-2 1.4-4.6 1.4c-2.6 0-4-1.2-4-2.6 0-1.9 2.5-2.6 5-3.2 3.2-.7 5.3-2.6 5.3-5.2 0-3.2-2.8-5.7-7-5.7-2 0-3.4.6-3.4.6l1.2 2.6s1-.5 2.2-.5z" fill="#fff"/></svg>
    </div>
    <h1>Need Legal<br>Consultant ?</h1>
    <p>will help you.</p>
  </div>

  <div class="signup-right">
    <div class="signup-box">
      <h2>Sign-up</h2>
      <form id="signupForm">
        <label>Full Name</label>
        <input type="text" required>
        <label>Email</label>
        <input type="email" required>
        <label>Password</label>
        <input type="password" required minlength="6">
        <label>Confirm Password</label>
        <input type="password" required minlength="6">
        <button type="submit" class="btn-white">Create Account</button>
      </form>
      <p class="switch-text">Already have an account? <a href="login.html">Login Here</a></p>
    </div>
  </div>
</div>

<script src="js/signup.js"></script>
</body>
</html>
